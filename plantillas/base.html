<!doctype html>
<!-- base.html -> PASO 9 de la ruta de estudio: el marco comun de todas las paginas.
     Python cambia cada {{clave}} por su valor (ver render() en servidor.py) -->

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo}} · Control de Asistencia</title>
  <!-- bootstrap y sus iconos desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- nuestro css (lo entrega python desde la carpeta static) -->
  <link href="/static/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark barra">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/"><i class="bi bi-clock-history me-2"></i>Control de Asistencia</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <!-- el menu lo arma Python segun el rol del usuario (rutas.html_menu) -->
        <ul class="navbar-nav ms-auto">
          {{menu}}
        </ul>
        <!-- nombre, rol y boton Salir (rutas.html_barra_usuario) -->
        {{barra_usuario}}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {{mensajes}}
    {{contenido}}
  </main>

  <footer class="container pb-4 small text-body-secondary">
    MiniProyecto Python · http.server + Bootstrap
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
