<div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-2">
  <div>
    <h1 class="h3 mb-0">Reporte semanal</h1>
    <span class="text-body-secondary">Horas trabajadas vs. horas esperadas, ordenado de mayor a menor</span>
  </div>
  <!-- exportar: python escribe JSON y XML al mismo tiempo (asyncio); solo superadmin (rutas.html_acciones_exportar) -->
  <div class="d-flex flex-wrap gap-2">
    {{acciones_exportar}}
  </div>
</div>

<div class="card tarjeta mb-4">
  <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
    {{navegacion}}
    <div class="leyenda small">
      <span class="dia dia-completo">✓</span>Completo
      <span class="dia dia-con-alertas">!</span>Con alertas
      <span class="dia dia-falta">✗</span>Falta
      <span class="dia dia-feriado">F</span>Feriado
      <span class="dia dia-pendiente">·</span>Pendiente
      <span class="dia dia-sin-ingresar"></span>Aún no ingresaba
    </div>
  </div>
  <div class="px-3 pb-3">{{feriados}}</div>
</div>

<div class="row g-4">{{tarjetas}}</div>
