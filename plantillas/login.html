<!-- login: POST /login con el correo y la contraseña -->
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card tarjeta mt-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-lock fs-1 text-primary"></i>
          <h1 class="h4 mt-2 mb-0">Iniciar sesión</h1>
          <span class="text-body-secondary small">Control de Asistencia</span>
        </div>
        <form method="post" action="/login">
          <!-- si el correo o la clave estan mal, el servidor nos regresa aqui con el error -->
          <input type="hidden" name="volver" value="/login">
          <div class="mb-3">
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" id="correo" name="correo" type="email" required autofocus autocomplete="username" placeholder="nombre@empresa.com">
          </div>
          <div class="mb-3">
            <label class="form-label" for="clave">Contraseña</label>
            <input class="form-control" id="clave" name="clave" type="password" required autocomplete="current-password">
          </div>
          <div class="d-grid">
            <button class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
          </div>
        </form>
        <p class="form-text text-center mt-3 mb-0">¿Olvidaste tu contraseña? Pídele a tu encargado que la restablezca.</p>
      </div>
    </div>
  </div>
</div>
